name: Merge hashes and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - "config/names.json"
      - "cmd/mergehash/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Merge JSON files
        run: |
          args=(-input data -output _site/pepper-scene-index.json)
          # The names mapping is optional.
          if [ -f config/names.json ]; then
            args+=(-names config/names.json)
          fi
          go run ./cmd/mergehash "${args[@]}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
